# Inventário de fontes — todas sondadas em 2026-09-05 (ver outputs/logs/01_test_data_access.log)
- id: tjdft_jurisdf
  name: "JurisDF — API pública de jurisprudência do TJDFT"
  url: "https://jurisdf.tjdft.jus.br/api/v1/pesquisa"
  access: >
    POST JSON; sem chave; tamanho<=40/página; filtros via termosAcessorios[{campo,valor}]
    (ex.: campo=dataJulgamento, valor="entre 2024-01-01 e 2024-12-31");
    retornaInteiroTeor=true devolve o inteiro teor (média 38 mil caracteres).
  coverage: >
    acórdãos (Turmas Cíveis e Turmas Recursais), decisões monocráticas, presidência;
    "dano moral" (espelho, sem sinônimos): 5.502 (2015), 6.320 (2017), 6.361 (2019),
    6.269 (2021), 7.979 (2023), 9.697 (2024), 11.374 (2025) acórdãos/ano.
  role: principal
  status: verificado
  license: "público; termos de uso a confirmar (D6)"
